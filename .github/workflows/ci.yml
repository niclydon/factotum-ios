name: CI

# Public contract gate: JSON parse, fixture-manifest completeness, and
# the required-key shape/privacy checks over fixtures/mobile-api.v1.
# Runs on a GitHub-hosted Linux runner so every push and PR (including
# forks) gets a result without touching private build hardware.
#
# The full Swift Codable decode and the Xcode device/simulator builds
# need a current Xcode SDK and are validated in the maintainer's private
# release pipeline, not here. See "Continuous integration" in README.md.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Contract fixtures (JSON + shape gate)
        run: bash scripts/verify-contract-fixtures.sh
